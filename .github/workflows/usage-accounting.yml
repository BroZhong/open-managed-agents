name: Usage accounting

on:
  pull_request:
    paths:
      - "adapter/**"
      - "deploy/Dockerfile.server"
      - "deploy/Dockerfile.web"
      - "deploy/k8s.yaml"
      - "deploy/migrations/**"
      - "sandbox/**"
      - "deploy/patch-*.mjs"
      - "deploy/*.test.mjs"
      - "server/packages/api/**"
      - "server/packages/session-router/**"
      - "server/packages/sandbox/**"
      - "server/patches/**"
      - "server/packages/store/**"
      - "server/packages/store-memory/**"
      - "server/packages/redis/**"
      - "server/pnpm-lock.yaml"
      - "web/src/**"
      - "web/test/**"
      - "web/vitest.config.ts"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/usage-accounting.yml"
  push:
    branches: [main]
    paths:
      - "adapter/**"
      - "deploy/Dockerfile.server"
      - "deploy/Dockerfile.web"
      - "deploy/k8s.yaml"
      - "deploy/migrations/**"
      - "sandbox/**"
      - "deploy/patch-*.mjs"
      - "deploy/*.test.mjs"
      - "server/packages/api/**"
      - "server/packages/session-router/**"
      - "server/packages/sandbox/**"
      - "server/patches/**"
      - "server/packages/store/**"
      - "server/packages/store-memory/**"
      - "server/packages/redis/**"
      - "server/pnpm-lock.yaml"
      - "web/src/**"
      - "web/test/**"
      - "web/vitest.config.ts"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/usage-accounting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: oma-test
          POSTGRES_DB: oma_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d oma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm --dir server install --frozen-lockfile
      - name: Install Pi SDK for native context restoration tests
        run: pnpm --dir adapter install --frozen-lockfile
      - name: Test durable attribution and aggregation
        run: >-
          pnpm --dir server --workspace-concurrency=1
          --filter @oma-server/store
          --filter @oma-server/store-memory
          --filter @oma-server/redis
          --filter @oma-server/session-router
          --filter @oma-server/sandbox
          --filter @oma-server/api test
      - name: Type-check the accounting path
        run: >-
          pnpm --dir server --workspace-concurrency=1
          --filter @oma-server/store
          --filter @oma-server/store-memory
          --filter @oma-server/redis
          --filter @oma-server/session-router
          --filter @oma-server/sandbox
          --filter @oma-server/api typecheck
      - name: Verify tool results and queue completion against real PostgreSQL
        env:
          PG_TEST_URL: postgresql://postgres:oma-test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/oma_test
          PG_TEST_SCHEMA: oma_unicode_test
        run: |
          pnpm --dir server --filter @oma-server/store exec vitest run test/event-payload.test.ts test/event-presentation.test.ts test/pending-event-store.test.ts
          pnpm --dir server --filter @oma-server/api exec vitest run test/big-results-pi-context.test.ts

  adapter-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: adapter/pnpm-lock.yaml
      - run: pnpm --dir adapter install --frozen-lockfile
      - name: Provision pinned native search binaries
        run: |
          python3 sandbox/prepare-search-binaries.py "$RUNNER_TEMP/pi-native-search-bin"
          printf '%s\n' "$RUNNER_TEMP/pi-native-search-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pi-native-search-bin/rg" --version
          "$RUNNER_TEMP/pi-native-search-bin/fd" --version
      - name: Test provider usage translation
        run: pnpm --dir adapter test
      - name: Type-check adapters
        run: pnpm --dir adapter typecheck
      - name: Test deployment overlays and migration inventory
        run: node --test deploy/*.test.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Test usage presentation and live event reduction
        run: pnpm --dir web test -- --maxWorkers=1
      - name: Build Web console
        run: pnpm --dir web build
