name: Sync OpenAPI to Apifox

on:
  workflow_run:
    workflows: ["OpenAPI contract"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apifox-openapi-sync
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile
      - name: Verify the generated contract and Hono route inventory
        run: |
          pnpm openapi:check
          pnpm --dir server --filter @oma-server/api exec vitest run test/openapi.test.ts
          node --test .github/scripts/apifox-*.test.mjs
      - name: Check Apifox credentials
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
          APIFOX_EXPECTED_PROJECT_NAME: ${{ vars.APIFOX_EXPECTED_PROJECT_NAME }}
          APIFOX_EXPECTED_TEAM_ID: ${{ vars.APIFOX_EXPECTED_TEAM_ID }}
          APIFOX_MAX_ENDPOINT_DELETIONS: ${{ vars.APIFOX_MAX_ENDPOINT_DELETIONS }}
          APIFOX_MAX_SCHEMA_DELETIONS: ${{ vars.APIFOX_MAX_SCHEMA_DELETIONS }}
          APIFOX_DOCS_SITE_ID: ${{ vars.APIFOX_DOCS_SITE_ID }}
          APIFOX_DOCS_URL: ${{ vars.APIFOX_DOCS_URL }}
          APIFOX_RUNNER_ID: ${{ vars.APIFOX_RUNNER_ID }}
          APIFOX_RUNNER_TYPE: ${{ vars.APIFOX_RUNNER_TYPE }}
        run: |
          if [[ -z "$APIFOX_ACCESS_TOKEN" || -z "$APIFOX_PROJECT_ID" || -z "$APIFOX_EXPECTED_PROJECT_NAME" || -z "$APIFOX_DOCS_SITE_ID" ]]; then
            echo "::error::Configure APIFOX_ACCESS_TOKEN and APIFOX_PROJECT_ID secrets, plus APIFOX_EXPECTED_PROJECT_NAME and APIFOX_DOCS_SITE_ID variables."
            exit 1
          fi
          if [[ -n "$APIFOX_EXPECTED_TEAM_ID" && ! "$APIFOX_EXPECTED_TEAM_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::APIFOX_EXPECTED_TEAM_ID must be a positive integer when configured."
            exit 1
          fi
          if [[ -n "$APIFOX_MAX_ENDPOINT_DELETIONS" && ! "$APIFOX_MAX_ENDPOINT_DELETIONS" =~ ^[0-9]+$ ]]; then
            echo "::error::APIFOX_MAX_ENDPOINT_DELETIONS must be a non-negative integer when configured."
            exit 1
          fi
          if [[ -n "$APIFOX_MAX_SCHEMA_DELETIONS" && ! "$APIFOX_MAX_SCHEMA_DELETIONS" =~ ^[0-9]+$ ]]; then
            echo "::error::APIFOX_MAX_SCHEMA_DELETIONS must be a non-negative integer when configured."
            exit 1
          fi
          if [[ ! "$APIFOX_DOCS_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Set APIFOX_DOCS_URL to the published Apifox documentation site's HTTPS URL."
            exit 1
          fi
          if [[ -n "$APIFOX_RUNNER_ID" && ! "$APIFOX_RUNNER_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::APIFOX_RUNNER_ID must be a positive integer when configured."
            exit 1
          fi
          if [[ -n "$APIFOX_RUNNER_TYPE" && -z "$APIFOX_RUNNER_ID" ]]; then
            echo "::error::APIFOX_RUNNER_TYPE requires APIFOX_RUNNER_ID."
            exit 1
          fi
          if [[ -n "$APIFOX_RUNNER_TYPE" && "$APIFOX_RUNNER_TYPE" != "TSHGR" && "$APIFOX_RUNNER_TYPE" != "OSHGR" ]]; then
            echo "::error::APIFOX_RUNNER_TYPE must be TSHGR (team Runner) or OSHGR (organization Runner)."
            exit 1
          fi
      - name: Prepare optional deployed API server metadata
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          APIFOX_RUNNER_ID: ${{ vars.APIFOX_RUNNER_ID }}
          APIFOX_RUNNER_TYPE: ${{ vars.APIFOX_RUNNER_TYPE }}
        run: |
          cp docs/openapi.json "$RUNNER_TEMP/openapi.json"
          if [[ -n "$PUBLIC_API_URL" ]]; then
            public_api_url="$(node .github/scripts/apifox-public-api-url.mjs "$PUBLIC_API_URL")"
            jq --arg url "$public_api_url" '.servers[0].url = $url' \
              "$RUNNER_TEMP/openapi.json" > "$RUNNER_TEMP/openapi-with-server.json"
            mv "$RUNNER_TEMP/openapi-with-server.json" "$RUNNER_TEMP/openapi.json"
          else
            echo "::notice::PUBLIC_API_URL is not configured; publishing documentation without a live public Try-it server."
            jq 'del(.servers)' "$RUNNER_TEMP/openapi.json" \
              > "$RUNNER_TEMP/openapi-without-server.json"
            mv "$RUNNER_TEMP/openapi-without-server.json" "$RUNNER_TEMP/openapi.json"
          fi
          if [[ -n "$APIFOX_RUNNER_ID" ]]; then
            if [[ -z "${public_api_url:-}" ]]; then
              echo "::error::PUBLIC_API_URL is required when APIFOX_RUNNER_ID enables remote scheduled imports."
              exit 1
            fi
            runner_type="${APIFOX_RUNNER_TYPE:-TSHGR}"
            jq --arg sourceUrl "$public_api_url/openapi.json" \
              --arg runOn "$runner_type" \
              --argjson runnerId "$APIFOX_RUNNER_ID" \
              '.sourceUrl = $sourceUrl | .runOn = $runOn | .runnerId = $runnerId' \
              docs/apifox-auto-import.json \
              > "$RUNNER_TEMP/apifox-auto-import.json"
          else
            echo "Apifox Runner is not configured; immediate CI import remains enabled."
          fi
      - name: Inspect public environment bindings
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
          APIFOX_DOCS_SITE_ID: ${{ vars.APIFOX_DOCS_SITE_ID }}
        run: |
          npx --yes apifox-cli@2.2.7 environment list \
            --project "$APIFOX_PROJECT_ID" \
            --access-token "$APIFOX_ACCESS_TOKEN" \
            > "$RUNNER_TEMP/apifox-environments.json"
          npx --yes apifox-cli@2.2.7 docs-site get "$APIFOX_DOCS_SITE_ID" \
            --project "$APIFOX_PROJECT_ID" \
            --access-token "$APIFOX_ACCESS_TOKEN" \
            > "$RUNNER_TEMP/apifox-docs-site-probe.json"
          jq '{environments: [.data[] | {id, name, baseUrl, baseUrls, type, visibility}]}' \
            "$RUNNER_TEMP/apifox-environments.json"
          jq '{environments: (.data.environments | walk(if type == "object" then with_entries(select(.key | test("token|secret|password|authorization"; "i") | not)) else . end))}' \
            "$RUNNER_TEMP/apifox-docs-site-probe.json"
      - name: Validate OpenAPI
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          if [[ -n "$PUBLIC_API_URL" ]]; then
            npx --yes --package=@redocly/cli@2.39.0 redocly lint "$RUNNER_TEMP/openapi.json"
          else
            # OpenAPI permits an omitted servers array. Redocly's recommended
            # profile treats it as an error, so skip only that opinionated rule
            # for documentation-only publishing.
            npx --yes --package=@redocly/cli@2.39.0 redocly lint \
              --skip-rule no-empty-servers "$RUNNER_TEMP/openapi.json"
          fi
      - name: Verify the dedicated Apifox project before import
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
          APIFOX_EXPECTED_PROJECT_NAME: ${{ vars.APIFOX_EXPECTED_PROJECT_NAME }}
          APIFOX_EXPECTED_TEAM_ID: ${{ vars.APIFOX_EXPECTED_TEAM_ID }}
          APIFOX_MAX_ENDPOINT_DELETIONS: ${{ vars.APIFOX_MAX_ENDPOINT_DELETIONS }}
          APIFOX_MAX_SCHEMA_DELETIONS: ${{ vars.APIFOX_MAX_SCHEMA_DELETIONS }}
        run: |
          project_file="$RUNNER_TEMP/apifox-project.json"
          npx --yes apifox-cli@2.2.7 project get "$APIFOX_PROJECT_ID" \
            --access-token "$APIFOX_ACCESS_TOKEN" > "$project_file"
          jq_args=(
            --arg id "$APIFOX_PROJECT_ID"
            --arg name "$APIFOX_EXPECTED_PROJECT_NAME"
          )
          project_filter='.success == true and (.data.id | tostring) == $id and .data.name == $name'
          if [[ -n "$APIFOX_EXPECTED_TEAM_ID" ]]; then
            jq_args+=(--arg teamId "$APIFOX_EXPECTED_TEAM_ID")
            project_filter="$project_filter and (.data.teamId | tostring) == \$teamId"
          fi
          if ! jq -e "${jq_args[@]}" "$project_filter" "$project_file" > /dev/null; then
            echo "::error::APIFOX_PROJECT_ID does not match the expected dedicated project identity."
            exit 1
          fi
          node .github/scripts/apifox-reconcile.mjs \
            --mode preflight \
            --spec "$RUNNER_TEMP/openapi.json" \
            --project "$APIFOX_PROJECT_ID"
      - name: Import OpenAPI into Apifox
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
        run: >-
          node .github/scripts/apifox-import.mjs
          --spec "$RUNNER_TEMP/openapi.json"
      - name: Reconcile the exact endpoint and schema inventory
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
          APIFOX_MAX_ENDPOINT_DELETIONS: ${{ vars.APIFOX_MAX_ENDPOINT_DELETIONS }}
          APIFOX_MAX_SCHEMA_DELETIONS: ${{ vars.APIFOX_MAX_SCHEMA_DELETIONS }}
        run: >-
          node .github/scripts/apifox-reconcile.mjs
          --spec "$RUNNER_TEMP/openapi.json"
          --project "$APIFOX_PROJECT_ID"
      - name: Ensure optional Runner synchronization from the remote OpenAPI endpoint
        if: ${{ vars.APIFOX_RUNNER_ID != '' }}
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
          APIFOX_RUNNER_ID: ${{ vars.APIFOX_RUNNER_ID }}
        run: |
          setting_name="$(jq -r '.name' "$RUNNER_TEMP/apifox-auto-import.json")"
          settings_file="$RUNNER_TEMP/apifox-auto-import-settings.json"
          runner_file="$RUNNER_TEMP/apifox-runner.json"

          npx --yes apifox-cli@2.2.7 runner get "$APIFOX_RUNNER_ID" \
            --project "$APIFOX_PROJECT_ID" \
            --access-token "$APIFOX_ACCESS_TOKEN" > "$runner_file"
          if ! jq -e '.data.status == "STARTED"' "$runner_file" > /dev/null; then
            echo "::error::The configured Apifox Runner is not STARTED; exact scheduled synchronization cannot run."
            exit 1
          fi

          npx --yes apifox-cli@2.2.7 import auto-import list \
            --project "$APIFOX_PROJECT_ID" \
            --access-token "$APIFOX_ACCESS_TOKEN" > "$settings_file"

          mapfile -t setting_ids < <(
            jq -r --arg name "$setting_name" \
              '.. | objects | select(.name? == $name and .id? != null) | .id' \
              "$settings_file" | sort -u
          )
          if (( ${#setting_ids[@]} > 1 )); then
            echo "::error::Multiple Apifox auto-import settings are named '$setting_name'. Remove duplicates before rerunning."
            exit 1
          fi

          create_setting() {
            npx --yes apifox-cli@2.2.7 cli-schema validate import-auto-import-create \
              --file "$RUNNER_TEMP/apifox-auto-import.json"
            npx --yes apifox-cli@2.2.7 import auto-import create \
              --project "$APIFOX_PROJECT_ID" \
              --file "$RUNNER_TEMP/apifox-auto-import.json" \
              --access-token "$APIFOX_ACCESS_TOKEN"
          }

          if (( ${#setting_ids[@]} == 0 )); then
            create_setting
          else
            setting_id="${setting_ids[0]}"
            setting_file="$RUNNER_TEMP/apifox-auto-import-setting.json"
            npx --yes apifox-cli@2.2.7 import auto-import get "$setting_id" \
              --project "$APIFOX_PROJECT_ID" \
              --access-token "$APIFOX_ACCESS_TOKEN" > "$setting_file"
            if jq -e --slurpfile expected "$RUNNER_TEMP/apifox-auto-import.json" \
              '.data as $actual |
               ($expected[0] | to_entries |
                all(.[]; $actual[.key] == .value))' "$setting_file" > /dev/null; then
              echo "Apifox auto-import setting '$setting_name' matches the repository configuration."
            else
              npx --yes apifox-cli@2.2.7 import auto-import delete "$setting_id" \
                --project "$APIFOX_PROJECT_ID" \
                --access-token "$APIFOX_ACCESS_TOKEN"
              create_setting
            fi
          fi
      - name: Verify the Apifox documentation site is published
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
          APIFOX_PROJECT_ID: ${{ secrets.APIFOX_PROJECT_ID }}
          APIFOX_DOCS_SITE_ID: ${{ vars.APIFOX_DOCS_SITE_ID }}
          APIFOX_DOCS_URL: ${{ vars.APIFOX_DOCS_URL }}
        run: |
          site_file="$RUNNER_TEMP/apifox-docs-site.json"
          npx --yes apifox-cli@2.2.7 docs-site get "$APIFOX_DOCS_SITE_ID" \
            --project "$APIFOX_PROJECT_ID" \
            --access-token "$APIFOX_ACCESS_TOKEN" > "$site_file"
          node .github/scripts/apifox-docs-site.mjs \
            --site-file "$site_file" \
            --project "$APIFOX_PROJECT_ID" \
            --site "$APIFOX_DOCS_SITE_ID" \
            --url "$APIFOX_DOCS_URL"
          if ! response_meta="$(curl --fail --silent --show-error \
            --proto '=https' --max-redirs 0 --max-filesize 5242880 \
            --retry 3 --connect-timeout 10 --max-time 60 \
            --output "$RUNNER_TEMP/apifox-docs-site.html" \
            --write-out $'%{http_code}\n%{content_type}' \
            "$APIFOX_DOCS_URL")"; then
            echo "::error::The published Apifox documentation URL is not publicly reachable: $APIFOX_DOCS_URL"
            exit 1
          fi
          http_status="${response_meta%%$'\n'*}"
          content_type="${response_meta#*$'\n'}"
          if [[ "$http_status" != "200" ]]; then
            echo "::error::The published Apifox documentation URL returned HTTP $http_status instead of 200."
            exit 1
          fi
          if [[ "$content_type" != text/html* ]]; then
            echo "::error::The published Apifox documentation URL did not return HTML."
            exit 1
          fi
          html_bytes="$(wc -c < "$RUNNER_TEMP/apifox-docs-site.html")"
          if (( html_bytes < 1000 )); then
            echo "::error::The published Apifox documentation response is unexpectedly small."
            exit 1
          fi
          {
            echo "### Apifox documentation site"
            echo "Verified published site ID: \`$APIFOX_DOCS_SITE_ID\`"
            echo "Verified public documentation: $APIFOX_DOCS_URL"
          } >> "$GITHUB_STEP_SUMMARY"
