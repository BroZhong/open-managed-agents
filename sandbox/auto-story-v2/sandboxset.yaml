# Sole maintained sandbox template; captured from Shanghai on 2026-09-16.
# Image advanced on 2026-09-21 via image-only patch; other live settings retained.
# Secret references only. Replace the pinned image after building and publishing.
---
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: auto-story-v2
  namespace: sandbox-system
spec:
  persistentContents:
  - filesystem
  replicas: 1
  runtimes:
  - name: csi
  - name: agent-runtime
  template:
    metadata:
      annotations:
        image.alibabacloud.com/enable-image-cache: 'true'
      labels:
        alibabacloud.com/acs: 'true'
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: OSS_READ_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: OSS_READ_ACCESS_KEY_ID
              name: base-secret
        - name: OSS_READ_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              key: OSS_READ_ACCESS_KEY_SECRET
              name: base-secret
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              key: GEMINI_API_KEY
              name: base-secret
              optional: true
        - name: GEMINI_AUDIO_MODEL
          valueFrom:
            secretKeyRef:
              key: GEMINI_AUDIO_MODEL
              name: base-secret
              optional: true
        - name: GEMINI_VIDEO_MODEL
          valueFrom:
            secretKeyRef:
              key: GEMINI_VIDEO_MODEL
              name: base-secret
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              key: GOOGLE_API_KEY
              name: base-secret
        - name: MEDIAKIT_API_KEY
          valueFrom:
            secretKeyRef:
              key: MEDIAKIT_API_KEY
              name: base-secret
        - name: MEDIAKIT_RUNTIME
          valueFrom:
            secretKeyRef:
              key: MEDIAKIT_RUNTIME
              name: base-secret
        - name: MEDIAKIT_SURFACE
          valueFrom:
            secretKeyRef:
              key: MEDIAKIT_SURFACE
              name: base-secret
        - name: OPENGROVE_WW_BASE_URL
          valueFrom:
            secretKeyRef:
              key: OPENGROVE_WW_BASE_URL
              name: base-secret
        - name: OSSUTIL_BIN
          valueFrom:
            secretKeyRef:
              key: OSSUTIL_BIN
              name: base-secret
        - name: OSS_READ_BUCKET
          valueFrom:
            secretKeyRef:
              key: OSS_READ_BUCKET
              name: base-secret
        - name: OSS_READ_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: OSS_READ_ENDPOINT
              name: base-secret
        - name: OSS_READ_REGION
          valueFrom:
            secretKeyRef:
              key: OSS_READ_REGION
              name: base-secret
        - name: OSS_READ_TABLE_ID
          valueFrom:
            secretKeyRef:
              key: OSS_READ_TABLE_ID
              name: base-secret
        - name: RUNTIME_ENV
          valueFrom:
            secretKeyRef:
              key: RUNTIME_ENV
              name: base-secret
        - name: VFS_TOKEN
          valueFrom:
            secretKeyRef:
              key: VFS_TOKEN
              name: base-secret
        - name: OPENGROVE_WW_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENGROVE_WW_ACCESS_TOKEN
              name: base-secret
        image: registry-vpc.cn-shanghai.aliyuncs.com/welltop/oma-sandbox@sha256:8ec76b3feb5978abeaf2711511d609b26225218b9ef421ce39d78cfdfc1bcf47
        imagePullPolicy: IfNotPresent
        name: sandbox
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '2'
            ephemeral-storage: 50Gi
            memory: 4Gi
        volumeMounts:
        - mountPath: "/run/auto-story-source"
          name: auto-story-source-readonly
          readOnly: true
      imagePullSecrets:
      - name: ali-shanghai
      volumes:
      - name: auto-story-source-readonly
        secret:
          defaultMode: 292
          items:
          - key: source.env
            path: source.env
          secretName: base-secret
  updateStrategy:
    maxUnavailable: 20%
