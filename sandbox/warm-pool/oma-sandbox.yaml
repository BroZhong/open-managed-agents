# The production Warm Pool (ADR-0024): every production Sandbox is claimed
# from it with its Session's Environment's image; this pool's own image, byte
# for byte, is a plain claim, any other is swapped in place.
#
# The template is oma-test-sandbox's (the live auto-story-v2 template without
# its base-secret pod env and its vfs-cli policy mount; see that manifest)
# without the test-only label, with production's 8 replicas.
#
# Image: video-production as built on oma-test on 2026-10-26 (oma-media-0.1.2,
# without Whisper); ACS ImageCache imc-uf6do32uk5dsbid1cj13 holds it. The
# production image builder replaces it with production's own video-production
# image once that is ready, after an ACS ImageCache for it. Re-applying this
# manifest afterwards would put that older image back.
#
# auto-story-v2 stays untouched for rollback until the release is accepted.
# Apply only to the agent-platform cluster:
#   kubectl --kubeconfig ~/.kube/agent-platform-config apply -f sandbox/warm-pool/oma-sandbox.yaml
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: oma-sandbox
  namespace: sandbox-system
spec:
  persistentContents:
  - filesystem
  replicas: 8
  runtimes:
  - name: csi
  - name: agent-runtime
  template:
    metadata:
      annotations:
        image.alibabacloud.com/enable-image-cache: "true"
      labels:
        alibabacloud.com/acs: "true"
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
    spec:
      automountServiceAccountToken: false
      containers:
      - name: sandbox
        image: registry-vpc.cn-shanghai.aliyuncs.com/welltop/oma-environments@sha256:490544134a0313d850ad29eb56ad516a13efd9a23dd469706e3a3a6534fdd111
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "2"
            ephemeral-storage: 50Gi
            memory: 4Gi
      imagePullSecrets:
      - name: ali-shanghai
      terminationGracePeriodSeconds: 30
  updateStrategy:
    maxUnavailable: 20%
