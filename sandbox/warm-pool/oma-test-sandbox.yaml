# The oma-test Warm Pool (ADR-0024): every oma-test Sandbox is claimed from it
# with its Session's Environment's image; this pool's own image, byte for
# byte, is a plain claim, any other is swapped in place.
#
# The pod template is the live auto-story-v2 template (sandbox-system, read
# 2026-10-26, generation 20) without its 18 base-secret pod env entries and
# without the vfs-cli policy ConfigMap mount: envd commands never saw pod env;
# every command gets its Session's Environment variables, platform references
# resolved from base-secret; video-production installs
# /etc/vfs-cli/policy.json (the same bytes) in its image. The live template had
# no source.env volume any more, and nothing reads /run/auto-story-source.
#
# Image: the transitional pool image (#301) = oma-media-0.1.2 + the
# video-production init.sh, built in the ADR-0024 Dockerfile shape and tagged
# video-production-transitional-20261026; ACS ImageCache
# imc-uf67ai761p6lax4fl3mn holds it. The image builder replaces it with
# video-production's image once that is ready, after an ACS ImageCache for it
# (an uncached refill pulls the whole image, ~1.8 GB).
#
# Resources and lifecycle as production's (ADR-0025; see oma-sandbox.yaml).
#
# Shares sandbox-system and the ACS quota with production: never touch
# auto-story-v2. Apply only to the agent-platform cluster:
#   kubectl --kubeconfig ~/.kube/agent-platform-config apply -f sandbox/warm-pool/oma-test-sandbox.yaml
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: oma-test-sandbox
  namespace: sandbox-system
  labels:
    oma.dev/test-only: "true"
spec:
  replicas: 1
  runtimes:
  - name: csi
  - name: agent-runtime
  template:
    metadata:
      annotations:
        image.alibabacloud.com/enable-image-cache: "true"
      labels:
        alibabacloud.com/acs: "true"
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
        oma.dev/test-only: "true"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: sandbox
        image: registry-vpc.cn-shanghai.aliyuncs.com/welltop/oma-sandbox@sha256:2dd85aa3e0317bd06735e2ebc6ed6ef5db075b7b0c2b3c7f83060704a960f2e4
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "1"
            memory: 4Gi
          requests:
            cpu: "1"
            ephemeral-storage: 15Gi
            memory: 4Gi
      imagePullSecrets:
      - name: ali-shanghai
      terminationGracePeriodSeconds: 30
  updateStrategy:
    maxUnavailable: 20%
