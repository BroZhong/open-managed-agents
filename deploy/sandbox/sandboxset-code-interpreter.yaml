# Inactive stock-image reference only; not an accepted application template.
# OSS Workspace runtime/tooling acceptance currently covers code-interpreter-vfscli.
# Do not apply or select this pool during the storage switch without separate
# validation. replicas=0 avoids maintaining an unvalidated warm pool by default.
# Use the explicit Shanghai kubeconfig described in oss-workspace/README.md.
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: code-interpreter
  namespace: sandbox-system
spec:
  replicas: 0
  # csi injects the NAS/OSS mounts; agent-runtime injects the e2b envd daemon.
  runtimes:
    - name: csi
    - name: agent-runtime
  template:
    metadata:
      # Required for ECI / serverless scheduling on this cluster — without these
      # the pod stays Pending with no ECI node assigned.
      labels:
        alibabacloud.com/acs: "true"
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sandbox
          image: registry-cn-shanghai-vpc.ack.aliyuncs.com/acs/code-interpreter:v1.6
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 30Gi
            limits:
              cpu: "1"
              memory: 1Gi
