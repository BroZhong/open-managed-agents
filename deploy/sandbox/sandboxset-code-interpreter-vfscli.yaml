# HISTORICAL REFERENCE: no longer maintained. Use sandboxset-auto-story-v2.yaml.
# Shanghai agent-platform / sandbox-system; observed 2026-09-14.
# Name is the E2B templateID. Mount metadata is supplied per Sandbox by Host.
# The image digest records the currently deployed artifact; rebuild the image
# before application cutover when launcher or dependency defaults change.
# Use an explicit Shanghai kubeconfig; see oss-workspace/README.md.
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: code-interpreter-vfscli
  namespace: sandbox-system
spec:
  persistentContents:
  - filesystem
  replicas: 1
  runtimes:
  - name: csi
  - name: agent-runtime
  template:
    metadata:
      annotations:
        agentry.welltop.tech/runtime-generation: identity-mtls-v1
        network.alibabacloud.com/wait-clusterip-ready: '*'
      labels:
        alibabacloud.com/acs: 'true'
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
    spec:
      automountServiceAccountToken: false
      containers:
      - image: registry-vpc.cn-shanghai.aliyuncs.com/welltop/oma-sandbox@sha256:f910f7b3aaefba6271f1dfe131874e90bfa62673bf6e043ef31b49b4169eb024
        name: sandbox
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '2'
            ephemeral-storage: 50Gi
            memory: 4Gi
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ali-shanghai
