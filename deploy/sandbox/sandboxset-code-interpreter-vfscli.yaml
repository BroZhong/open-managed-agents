# OPTIONAL, NOT CURRENTLY DEPLOYED. Prototype warm pool for a custom
# `code-interpreter-vfscli` template on agent-platform. Production uses the
# stock `code-interpreter` pool from sandboxset-code-interpreter.yaml.
#
# The SandboxSet name IS the E2B templateID. Agents opt in with
# `sandbox.image: "code-interpreter-vfscli"`; the default `code-interpreter`
# pool (sandboxset-code-interpreter.yaml) is left untouched.
#
# Only two things are meant to be tuned here:
#   - spec.replicas      → warm-pool size
#   - the container image tag
#
# ⚠️ Private ACR pull: the CRD has no dedicated imagePullSecrets field, but the
# pod template passes it through — hence template.spec.imagePullSecrets below.
# The `ali-shanghai` Secret must exist in sandbox-system before this optional
# pool is enabled. CUSTOM_SANDBOX_IMAGE is a release-time placeholder; replace
# it with an immutable image from the Shanghai ACR before applying.
#
# Apply (idempotent):
#   KUBECONFIG=~/.kube/agent-platform-config kubectl apply -f deploy/sandbox/sandboxset-code-interpreter-vfscli.yaml
#   KUBECONFIG=~/.kube/agent-platform-config kubectl get sbs -n sandbox-system code-interpreter-vfscli
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: code-interpreter-vfscli
  namespace: sandbox-system
spec:
  replicas: 1
  # csi injects the NAS/OSS mounts; agent-runtime injects the e2b envd daemon.
  runtimes:
    - name: csi
    - name: agent-runtime
  template:
    metadata:
      # Required for ECI / serverless scheduling on this cluster — without these
      # the pod stays Pending with no ECI node assigned.
      labels:
        alibabacloud.com/acs: "true"
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
    spec:
      automountServiceAccountToken: false
      # Pull the optional custom image from the Shanghai ACR.
      imagePullSecrets:
        - name: ali-shanghai
      containers:
        - name: sandbox
          image: CUSTOM_SANDBOX_IMAGE
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 30Gi
            limits:
              cpu: "1"
              memory: 1Gi
