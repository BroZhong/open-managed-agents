# Independent E2B template: Agent sandbox.image = "auto-story".
# Build and push deploy/sandbox/auto-story first; keep credentials in each
# sandbox's Environment Spec, never in a reusable warm-pool Pod template.
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: auto-story
  namespace: sandbox-system
spec:
  replicas: 1
  runtimes:
    - name: csi
    - name: agent-runtime
  template:
    metadata:
      labels:
        alibabacloud.com/acs: "true"
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ali-shanghai
      containers:
        - name: sandbox
          image: registry-vpc.cn-shanghai.aliyuncs.com/welltop/oma-sandbox@sha256:bdf9bdc74ad8e1f289b3993bb8154e388a505a43c3e24d47cbaae874e5ad49f4
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 50Gi
            limits:
              cpu: "2"
              memory: 4Gi
