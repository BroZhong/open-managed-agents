# Independent E2B template: Agent sandbox.image = "auto-story".
# Build and push deploy/sandbox/auto-story first; keep credentials in each
# sandbox's Environment Spec, never in a reusable warm-pool Pod template.
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: auto-story
  namespace: sandbox-system
spec:
  replicas: 1
  runtimes:
    - name: csi
    - name: agent-runtime
  template:
    metadata:
      labels:
        alibabacloud.com/acs: "true"
        alibabacloud.com/compute-class: agent-sandbox
        alibabacloud.com/compute-qos: default
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ali-shanghai
      containers:
        - name: sandbox
          image: registry-vpc.cn-shanghai.aliyuncs.com/welltop/oma-sandbox@sha256:dd6437954752ff8527225bd2198245b89c75598a43c2e17d652d3d43279a4a72
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 50Gi
            limits:
              cpu: "2"
              memory: 4Gi
