# The Host reads one existing Secret across namespaces at startup. It cannot
# list Secrets, read other Secrets, or change the shared sandbox credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oma-server
  namespace: oma-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oma-read-base-secret
  namespace: sandbox-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["base-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oma-read-base-secret
  namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oma-read-base-secret
subjects:
  - kind: ServiceAccount
    name: oma-server
    namespace: oma-infra
