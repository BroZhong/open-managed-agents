# KEDA scales the oma-test Runners on their demand (ADR-0026): the Turns they
# execute plus the Sessions whose input waits to be claimed, read from the
# API's internal endpoint. Intervene only through this file or the pause
# annotations, never `kubectl scale` (deploy/README.md, "Runner autoscaling").
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: oma-runner-demand
spec:
  # The API reads the same Secret as RUNNER_DEMAND_TOKEN.
  secretTargetRef:
  - parameter: token
    name: oma-runner-demand
    key: token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: oma-runner
spec:
  scaleTargetRef:
    name: oma-runner
  # Test idles at no Runner, unlike production's minimum of 2 (ADR-0026): the
  # first input after an idle period waits for a Runner to start. With none,
  # the console cannot read a managed model's thinking levels and no Loop
  # fires, since only Runners run the Loop scheduler.
  minReplicaCount: 0
  maxReplicaCount: 50
  # At no Runner KEDA itself polls the demand and starts the first one when
  # it is above 0; from one Runner up the HPA reads it every 15 s.
  pollingInterval: 10
  # The last Runner leaves 600 s after the demand reached 0, the HPA's
  # scale-down window for the others.
  cooldownPeriod: 600
  # A failing demand read never scales in. KEDA counts consecutive failures;
  # past 3 the HPA is told the current count (at least 1), and until then it
  # keeps the count it has.
  fallback:
    failureThreshold: 3
    replicas: 1
    behavior: currentReplicasIfHigher
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # A burst is met at once, 10 Runners per 15 s.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 10
            periodSeconds: 15
        # Each Runner removed hands its Turns over (ADR-0021), so slowly.
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
          - type: Pods
            value: 2
            periodSeconds: 60
  triggers:
  - type: metrics-api
    # Replicas = ceil(demand / targetValue).
    metricType: AverageValue
    metadata:
      url: http://oma-api.oma-test.svc.cluster.local:3000/internal/runner-demand
      valueLocation: demand
      # C, the demand per Runner: below RUNNER_CAPACITY (N = 50), so a Runner
      # has free places when the fleet is at its target.
      targetValue: '40'
      authMode: bearer
      # Longer than the endpoint's 5 s database timeout, so a slow answer is
      # used and a timeout arrives as its 503 (KEDA's default here is 3 s).
      timeout: 7s
    authenticationRef:
      name: oma-runner-demand
