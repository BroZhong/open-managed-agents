# Test environment: same cluster, RDS instance and Workspace OSS bucket as
# production; separate namespace, schema/role, Redis, Skill bucket, host and
# Warm Pool (oma-test-sandbox, ADR-0024). Secrets are copies of production
# with the test PG password.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oma-test
resources:
- ../../app
- namespace.yaml
- service-account.yaml
- redis.yaml
patches:
- target:
    kind: ConfigMap
    name: oma-api-config
  patch: |-
    - {op: replace, path: /data/PUBLIC_API_URL, value: https://agentry-test.welltop.tech/api}
    - {op: replace, path: /data/PG_USER, value: oma_test_app}
    - {op: replace, path: /data/PG_SCHEMA, value: oma_test}
    - {op: replace, path: /data/REDIS_HOST, value: redis}
    - {op: replace, path: /data/S3_BUCKET, value: workspace-test}
- target:
    kind: ConfigMap
    name: oma-runner-config
  patch: |-
    - {op: replace, path: /data/PG_USER, value: oma_test_app}
    - {op: replace, path: /data/PG_SCHEMA, value: oma_test}
    - {op: replace, path: /data/PG_POOL_MAX, value: '10'}
    - {op: replace, path: /data/REDIS_HOST, value: redis}
    - {op: replace, path: /data/S3_BUCKET, value: workspace-test}
    - {op: replace, path: /data/OMA_ENVIRONMENT, value: test}
    # The oma-test Warm Pool (sandbox/warm-pool/oma-test-sandbox.yaml).
    - {op: replace, path: /data/SANDBOX_TEMPLATE, value: oma-test-sandbox}
- target:
    kind: ConfigMap
    name: oma-image-builder-config
  patch: |-
    - {op: replace, path: /data/PG_USER, value: oma_test_app}
    - {op: replace, path: /data/PG_SCHEMA, value: oma_test}
    - {op: replace, path: /data/OMA_ENVIRONMENT, value: test}
    - {op: replace, path: /data/SANDBOX_TEMPLATE, value: oma-test-sandbox}
- target:
    kind: Deployment
    name: oma-runner
  # Fault injection on test only. With a shared process namespace the Runner's
  # node process is not PID 1, so `kill -9` from `kubectl exec` stops it
  # abruptly, the way an OOM kill or a node failure would.
  patch: |-
    - {op: add, path: /spec/template/spec/shareProcessNamespace, value: true}
- target:
    kind: Ingress
    name: oma-console
  patch: |-
    - {op: replace, path: /spec/tls/0/hosts/0, value: agentry-test.welltop.tech}
    - {op: replace, path: /spec/rules/0/host, value: agentry-test.welltop.tech}
