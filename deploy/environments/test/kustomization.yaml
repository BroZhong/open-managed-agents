# Test environment: same cluster, RDS instance, Sandbox pool and Workspace OSS
# bucket as production; separate namespace, schema/role, Redis, Skill bucket
# and host. Secrets are copies of production with the test PG password.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oma-test
replicas:
- name: oma-runner
  count: 2
resources:
- ../../app
- namespace.yaml
- service-account.yaml
- redis.yaml
patches:
- target:
    kind: ConfigMap
    name: oma-api-config
  patch: |-
    - {op: replace, path: /data/PUBLIC_API_URL, value: https://agentry-test.welltop.tech/api}
    - {op: replace, path: /data/PG_USER, value: oma_test_app}
    - {op: replace, path: /data/PG_SCHEMA, value: oma_test}
    - {op: replace, path: /data/REDIS_HOST, value: redis}
    - {op: replace, path: /data/S3_BUCKET, value: workspace-test}
- target:
    kind: ConfigMap
    name: oma-runner-config
  patch: |-
    - {op: replace, path: /data/PG_USER, value: oma_test_app}
    - {op: replace, path: /data/PG_SCHEMA, value: oma_test}
    - {op: replace, path: /data/PG_POOL_MAX, value: '10'}
    - {op: replace, path: /data/REDIS_HOST, value: redis}
    - {op: replace, path: /data/S3_BUCKET, value: workspace-test}
- target:
    kind: Deployment
    name: oma-runner
  # #234 on test only. With a shared process namespace the Runner's node process
  # is not PID 1, so `kill -9` from `kubectl exec` stops it abruptly, the way an
  # OOM kill or a node failure would. A rolling update starts the new Runner
  # before the old one hands its Turns over on SIGTERM (#254).
  patch: |-
    - {op: add, path: /spec/template/spec/shareProcessNamespace, value: true}
    - {op: replace, path: /spec/strategy, value: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}}
- target:
    kind: Ingress
    name: oma-console
  patch: |-
    - {op: replace, path: /spec/tls/0/hosts/0, value: agentry-test.welltop.tech}
    - {op: replace, path: /spec/rules/0/host, value: agentry-test.welltop.tech}
