# Production on agent-platform. Releases update images only; see deploy/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oma-infra
resources:
- ../../app
- ../../../sandbox/environments/video-production
patches:
# The public /api route still targets the legacy oma-server Service, whose
# selector was switched to app=oma-api during the API/Runner cutover.
- target:
    kind: Ingress
    name: oma-console
  patch: |-
    - op: replace
      path: /spec/rules/0/http/paths/0/backend/service/name
      value: oma-server
# Fixed Runners until the production ScaledObject (#335); the base declares no
# replicas because KEDA owns the count where it scales.
- target:
    kind: Deployment
    name: oma-runner
  patch: |-
    - {op: add, path: /spec/replicas, value: 5}

# Keep the promoted definition independent of the older builder server image.
- target:
    kind: Deployment
    name: oma-image-builder
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: oma-image-builder
    spec:
      template:
        spec:
          volumes:
          - name: video-production-definition
            configMap:
              name: oma-video-production-definition
          containers:
          - name: builder
            volumeMounts:
            - name: video-production-definition
              mountPath: /app/sandbox/environments/video-production
              readOnly: true
