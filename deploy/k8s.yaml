# Existing application Server + Web in oma-infra. This change does not migrate
# the application cluster, PostgreSQL, Redis, Supabase Skills storage or proxy.
# Workspace files use Shanghai OSS; remote Sandboxes use the Shanghai E2B
# endpoint declared below. Apply only during the coordinated maintenance switch
# in docs/oss-workspace-deployment.md, using the explicit APPLICATION kubeconfig.
# The separate Shanghai Sandbox manifests require their own explicit kubeconfig.
#
# Before the approved switch, provision these keys through the existing secret
# management process in oma-infra/oma-secrets (never commit or print values):
#   PG_PASSWORD, REDIS_PASSWORD, SUPABASE_SERVICE_KEY,
#   WORKSPACE_OSS_ACCESS_KEY_ID, WORKSPACE_OSS_ACCESS_KEY_SECRET,
#   E2B_API_KEY (the Shanghai gateway key), DEFAULT_SANDBOX_VFS_TOKEN.
# WORKSPACE_OSS_STS_TOKEN is optional for temporary Host credentials. It is not
# the Sandbox's Agent Identity token and is not automatically refreshed by this
# environment-based Host configuration. Existing unused Secret keys need not be
# deleted during this storage switch.
#
# The OpenGrove WW integration is OFF in this manifest by default; enabling it
# is a separate all-or-nothing step (see "OpenGrove WW" below). Do not add
# OPENGROVE_WW_ACCESS_TOKEN to the command above in isolation.
#
# The sandbox is mandatory (issue #54): SANDBOX_ENABLED=true below + the E2B_*
# secrets are what make Agent runs execute inside a sandbox. A sandboxed Agent
# with no provisionable executor now fails loud (session.error
# code=sandbox_unavailable) instead of falling back to the pod filesystem.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oma-server-config
  namespace: oma-infra
data:
  PORT: "3000"
  AUTH_DISABLED: "false"
  # PostgreSQL (internal RDS; oma schema; sslmode=disable)
  PG_HOST: "pgm-j6cwo1dku533bqbs.pg.cnhk.rds.aliyuncs.com"
  PG_PORT: "5432"
  PG_DATABASE: "supabase_db"
  PG_USER: "oma_app"
  PG_SCHEMA: "oma"
  PG_SSL: "false"
  # The oma schema is pre-provisioned by migration and oma_app lacks CREATE on
  # the database, so skip the app's startup DDL.
  PG_ENSURE_SCHEMA: "false"
  # Redis — use ClusterIP, NOT the Service name: even same-ns Service DNS is
  # unreliable on this ECI/virtual-kubelet cluster (name "redis" → NXDOMAIN).
  # Re-check with `kubectl --kubeconfig "$OMA_APP_KUBECONFIG" -n oma-infra get svc redis` if it drifts.
  REDIS_HOST: "10.0.56.147"
  REDIS_PORT: "6379"
  # Existing Supabase Storage is retained for Skills only. Its historical
  # bucket name stays "workspace"; it no longer selects Workspace file storage.
  S3_ENDPOINT: "http://172.17.108.247:80/storage/v1"
  S3_BUCKET: "workspace"
  # Host Workspace API storage. The existing application network uses the public
  # Shanghai endpoint; choose the internal endpoint only after network testing.
  # Browser GET signatures must always use the public regional HTTPS endpoint.
  WORKSPACE_OSS_REGION: "oss-cn-shanghai"
  WORKSPACE_OSS_BUCKET: "agentry"
  WORKSPACE_OSS_ENDPOINT: "https://oss-cn-shanghai.aliyuncs.com"
  WORKSPACE_OSS_PUBLIC_ENDPOINT: "https://oss-cn-shanghai.aliyuncs.com"
  # Shanghai CSI identity resources. Host object-storage credentials stay on
  # the Host; Sandbox credentials are issued separately by Agent Identity/RRSA.
  WORKSPACE_OSS_AGENT_NAME: "agentry-workspace"
  WORKSPACE_OSS_PV_NAME: "agentry-workspace-oss"
  WORKSPACE_OSS_CREDENTIAL_PROVIDER: "agentry-oss-rw"
  # Egress proxy for LLM calls (OpenAI/Anthropic geo-block Alibaba HK egress).
  # In-cluster sing-box (mixed inbound). ClusterIP — re-check if it drifts.
  OMA_PROXY_URL: "http://10.0.200.134:7890"
  # Sandbox is mandatory (issue #54). This turns on the sandbox-backed
  # ToolExecutor. The endpoint is Shanghai; its key comes from oma-secrets.
  SANDBOX_ENABLED: "true"
  # E2B templateID = the SandboxSet name in the sandbox-system namespace
  # (see deploy/sandbox/README.md). Verify every per-Agent template override;
  # a changed default does not replace an existing Sandbox.
  SANDBOX_TEMPLATE: "code-interpreter-vfscli"
  E2B_DOMAIN: "sandbox.agentry.welltop.tech"
  # ALB timeout is 180 seconds; allow its response to reach the SDK. Sandbox
  # lifetime is a separate setting (Manager default: 3600 seconds).
  E2B_REQUEST_TIMEOUT_MS: "185000"
  # ==========================================================================
  # OpenGrove WW — DISABLED BY DEFAULT (issue #116). ALL-OR-NOTHING.
  # --------------------------------------------------------------------------
  # sandboxEnvPolicyFromHost (server/packages/api/src/lib/sandbox-env.ts) fails
  # loud at startup when only SOME of the three WW variables are set, because a
  # half-configured managed credential is a misconfiguration, not a feature
  # toggle. This manifest previously shipped two of the three (BASE_URL +
  # AGENT_IDS) while the third came from an oma-secrets key that a manual,
  # never-executed `kubectl create secret` line was supposed to create — so a
  # full `kubectl apply` put oma-server into CrashLoopBackOff. The default path
  # must therefore contain ZERO of the three, matching the live cluster
  # ConfigMap (the two keys were removed there on 2026-07-29).
  #
  # Cost of leaving it off: agent `agent_DAHfGLi_tD9TctXw9cEqo`'s sandbox gets
  # no WW credentials, so `story-seed` has no OPENGROVE_WW_BASE_URL /
  # OPENGROVE_WW_ACCESS_TOKEN and its WW-backed steps fail. Everything else,
  # including every other Agent, is unaffected.
  #
  # TO TURN WW ON — do all three steps together, in this order, or none:
  #
  #   1. Create the secret key FIRST (it must exist before the Deployment
  #      references it, otherwise the pod stays in CreateContainerConfigError):
  #        kubectl --kubeconfig "$OMA_APP_KUBECONFIG" -n oma-infra patch secret oma-secrets --type=merge \
  #          -p "{\"stringData\":{\"OPENGROVE_WW_ACCESS_TOKEN\":\"<bearer>\"}}"
  #        Confirm the key exists using the secret-management system; do not
  #        print any portion of the bearer when checking presence.
  #
  #   2. Uncomment BOTH ConfigMap keys here:
  #        DEFAULT_SANDBOX_OPENGROVE_WW_BASE_URL: "https://opengrove.creativefitting.cn"
  #        DEFAULT_SANDBOX_OPENGROVE_WW_AGENT_IDS: "agent_DAHfGLi_tD9TctXw9cEqo"
  #      (BASE_URL is the non-secret endpoint paired with the Host-managed
  #      bearer; AGENT_IDS is a comma-separated allowlist — the credential is
  #      injected only into those Agents' sandboxes, never deployment-wide.)
  #
  #   3. Uncomment the matching DEFAULT_SANDBOX_OPENGROVE_WW_ACCESS_TOKEN env
  #      entry in the oma-server container below, then apply + roll:
  #        kubectl --kubeconfig "$OMA_APP_KUBECONFIG" apply -f deploy/k8s.yaml
  #        kubectl --kubeconfig "$OMA_APP_KUBECONFIG" -n oma-infra rollout status deploy/oma-server
  #
  # Reverting is the same three edits in reverse; leaving any single one behind
  # reproduces the startup crash. Keep repo and cluster in sync either way.
  # ==========================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-server
  namespace: oma-infra
  labels: { app: oma-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-server }
  template:
    metadata:
      labels: { app: oma-server }
    spec:
      imagePullSecrets:
        - name: oma-acr
      volumes:
        # Pi provider credentials (openai-codex OAuth). Copied to a writable
        # emptyDir by initContainer so Pi's AuthStorage can refresh the token.
        - name: pi-auth-seed
          secret: { secretName: oma-pi-auth }
        - name: pi-agent-dir
          emptyDir: {}
      initContainers:
        - name: seed-pi-auth
          image: OMA_SERVER_IMAGE  # replaced at deploy time
          command: ["sh", "-c", "mkdir -p /root/.pi/agent && cp -a /opt/pi-agent-seed/. /root/.pi/agent/ && cp /seed/auth.json /root/.pi/agent/auth.json && chmod 600 /root/.pi/agent/auth.json"]
          volumeMounts:
            - { name: pi-auth-seed, mountPath: /seed, readOnly: true }
            - { name: pi-agent-dir, mountPath: /root/.pi/agent }
      containers:
        - name: server
          image: OMA_SERVER_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: oma-server-config }
          env:
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: PG_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: REDIS_PASSWORD } }
            - name: SUPABASE_SERVICE_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: SUPABASE_SERVICE_KEY } }
            # Required Host OSS credentials, independent of the Sandbox's RRSA
            # identity and the Supabase service key used only for Skills.
            - name: WORKSPACE_OSS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: oma-secrets, key: WORKSPACE_OSS_ACCESS_KEY_ID } }
            - name: WORKSPACE_OSS_ACCESS_KEY_SECRET
              valueFrom: { secretKeyRef: { name: oma-secrets, key: WORKSPACE_OSS_ACCESS_KEY_SECRET } }
            - name: WORKSPACE_OSS_STS_TOKEN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: WORKSPACE_OSS_STS_TOKEN, optional: true } }
            # Must be the Shanghai gateway key matching ConfigMap E2B_DOMAIN.
            - name: E2B_API_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: E2B_API_KEY } }
            # The same VFS access token is exposed under two purpose-specific
            # names: vfs-cli receives VFS_TOKEN inside each sandbox through the
            # Host's DEFAULT_SANDBOX_VFS_TOKEN mapping; pi-mcp-adapter resolves
            # ${RDS_MCP_APIKEY} in the Host-only RDS MCP config.
            - name: DEFAULT_SANDBOX_VFS_TOKEN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
            - name: RDS_MCP_APIKEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
            # OpenGrove WW — DISABLED BY DEFAULT (issue #116). Uncomment only as
            # step 3 of the all-or-nothing procedure in the ConfigMap comment
            # above, and only after the oma-secrets key actually exists.
            # story-seed receives the WW credential only when a sandbox is
            # created. The value stays out of the image, ConfigMap, Agent row,
            # and repository; SessionRouter treats it as Host-managed so an
            # Agent cannot pair it with a different endpoint.
            # - name: DEFAULT_SANDBOX_OPENGROVE_WW_ACCESS_TOKEN
            #   valueFrom: { secretKeyRef: { name: oma-secrets, key: OPENGROVE_WW_ACCESS_TOKEN } }
          volumeMounts:
            - { name: pi-agent-dir, mountPath: /root/.pi/agent }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-server
  namespace: oma-infra
spec:
  selector: { app: oma-server }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-web
  namespace: oma-infra
  labels: { app: oma-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-web }
  template:
    metadata:
      labels: { app: oma-web }
    spec:
      imagePullSecrets:
        - name: oma-acr
      containers:
        - name: web
          image: OMA_WEB_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-web
  namespace: oma-infra
spec:
  selector: { app: oma-web }
  ports:
    - port: 80
      targetPort: 80
