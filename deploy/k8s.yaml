# Open Managed Agents Server + Web on the `agent-platform` ACS cluster in
# cn-shanghai. Application resources live in `oma-infra`; the ACK-managed
# sandbox control plane and warm pools live in `sandbox-system`.
#
# This file owns the OMA ConfigMap, Deployments, Services, and public Ingress.
# Redis, sing-box, the ALB controller, and the ACK sandbox-manager installation
# already exist in the cluster and are not created here. Secrets are injected
# at runtime and are never baked into an image.
#
# OMA_SERVER_IMAGE and OMA_WEB_IMAGE are release-time placeholders. Replace
# both with immutable images from
# registry-vpc.cn-shanghai.aliyuncs.com/welltop before applying this manifest.
#
# Create the secret first (values NOT committed):
#   kubectl -n oma-infra create secret generic oma-secrets \
#     --from-literal=PG_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=SUPABASE_SERVICE_KEY=... \
#     --from-literal=E2B_DOMAIN=... \
#     --from-literal=E2B_API_KEY=... \
#     --from-literal=DEFAULT_SANDBOX_VFS_TOKEN=... \
#     --from-literal=AUTH_JWT_SECRET=... \
#     --from-literal=INVITE_CODE=... \
#     --from-literal=ALIYUN_ACCESS_KEY_ID=... \
#     --from-literal=ALIYUN_ACCESS_KEY_SECRET=...
#
# The following objects must also exist before rollout:
#   - oma-infra/oma-pi-auth   (Pi auth.json)
#   - oma-infra/ali-shanghai (ACR image-pull credentials)
#   - oma-infra/agentry-tls  (TLS certificate for agentry.welltop.tech)
#
# The OpenGrove WW integration is OFF in this manifest by default; enabling it
# is a separate all-or-nothing step (see "OpenGrove WW" below). Do not add
# OPENGROVE_WW_ACCESS_TOKEN to the command above in isolation.
#
# The sandbox is mandatory (issue #54): SANDBOX_ENABLED=true below + the E2B_*
# secrets are what make Agent runs execute inside a sandbox. A sandboxed Agent
# with no provisionable executor now fails loud (session.error
# code=sandbox_unavailable) instead of falling back to the pod filesystem.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oma-server-config
  namespace: oma-infra
data:
  PORT: "3000"
  API_BASE_PATH: "/api"
  PUBLIC_API_URL: "https://agentry.welltop.tech"
  AUTH_DISABLED: "false"
  ALIYUN_REGION: "cn-shanghai"
  OMA_SUPABASE_ALLOWED_TENANTS: ""
  # PostgreSQL (cn-shanghai internal RDS; oma schema; sslmode=disable)
  PG_HOST: "pgm-uf6fh394661t62gb.pg.rds.aliyuncs.com"
  PG_PORT: "5432"
  PG_DATABASE: "supabase_db"
  PG_USER: "oma_app"
  PG_SCHEMA: "oma"
  PG_SSL: "false"
  # The oma schema is pre-provisioned by migration and oma_app lacks CREATE on
  # the database, so skip the app's startup DDL.
  PG_ENSURE_SCHEMA: "false"
  # These ClusterIPs mirror the current agent-platform deployment. Re-check the
  # corresponding Services before applying if cluster infrastructure changes.
  REDIS_HOST: "10.0.64.18"
  REDIS_PORT: "6379"
  # Supabase Storage (S3 artifacts) — cn-shanghai VPC endpoint.
  S3_ENDPOINT: "http://172.17.255.52:80/storage/v1"
  S3_BUCKET: "workspace"
  STORAGE_PUBLIC_BASE: "http://172.17.255.52:80/storage/v1"
  # In-cluster sing-box mixed inbound used for external LLM calls.
  OMA_PROXY_URL: "http://10.0.165.246:7890"
  # Sandbox is mandatory (issue #54). This turns on the sandbox-backed
  # ToolExecutor; the E2B endpoint + key come from oma-secrets (below).
  SANDBOX_ENABLED: "true"
  # E2B templateID = SandboxSet metadata.name in sandbox-system.
  SANDBOX_TEMPLATE: "code-interpreter"
  # ==========================================================================
  # OpenGrove WW — DISABLED BY DEFAULT (issue #116). ALL-OR-NOTHING.
  # --------------------------------------------------------------------------
  # sandboxEnvPolicyFromHost (server/packages/api/src/lib/sandbox-env.ts) fails
  # loud at startup when only SOME of the three WW variables are set, because a
  # half-configured managed credential is a misconfiguration, not a feature
  # toggle. This manifest previously shipped two of the three (BASE_URL +
  # AGENT_IDS) while the third came from an oma-secrets key that a manual,
  # never-executed `kubectl create secret` line was supposed to create — so a
  # full `kubectl apply` put oma-server into CrashLoopBackOff. The default path
  # therefore contains ZERO of the three, matching agent-platform production.
  #
  # Cost of leaving it off: sandboxes receive no OPENGROVE_WW_BASE_URL /
  # OPENGROVE_WW_ACCESS_TOKEN, so WW-backed Skill steps are unavailable.
  #
  # TO TURN WW ON — do all three steps together, in this order, or none:
  #
  #   1. Create the secret key FIRST (it must exist before the Deployment
  #      references it, otherwise the pod stays in CreateContainerConfigError):
  #        kubectl -n oma-infra patch secret oma-secrets --type=merge \
  #          -p "{\"stringData\":{\"OPENGROVE_WW_ACCESS_TOKEN\":\"<bearer>\"}}"
  #        kubectl -n oma-infra get secret oma-secrets \
  #          -o jsonpath='{.data.OPENGROVE_WW_ACCESS_TOKEN}' | head -c 1   # non-empty
  #
  #   2. Uncomment BOTH ConfigMap keys here:
  #        DEFAULT_SANDBOX_OPENGROVE_WW_BASE_URL: "https://opengrove.creativefitting.cn"
  #        DEFAULT_SANDBOX_OPENGROVE_WW_AGENT_IDS: "<comma-separated-agent-ids>"
  #      (BASE_URL is the non-secret endpoint paired with the Host-managed
  #      bearer; AGENT_IDS is a comma-separated allowlist — the credential is
  #      injected only into those Agents' sandboxes, never deployment-wide.)
  #
  #   3. Uncomment the matching DEFAULT_SANDBOX_OPENGROVE_WW_ACCESS_TOKEN env
  #      entry in the oma-server container below, then apply + roll:
  #        kubectl apply -f deploy/k8s.yaml
  #        kubectl -n oma-infra rollout status deploy/oma-server
  #
  # Reverting is the same three edits in reverse; leaving any single one behind
  # reproduces the startup crash. Keep repo and cluster in sync either way.
  # ==========================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-server
  namespace: oma-infra
  labels: { app: oma-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-server }
  template:
    metadata:
      labels:
        app: oma-server
        alibabacloud.com/acs: "true"
    spec:
      imagePullSecrets:
        - name: ali-shanghai
      volumes:
        # Pi provider credentials (openai-codex OAuth). Copied to a writable
        # emptyDir by initContainer so Pi's AuthStorage can refresh the token.
        - name: pi-auth-seed
          secret: { secretName: oma-pi-auth }
        - name: pi-agent-dir
          emptyDir: {}
      initContainers:
        - name: seed-pi-auth
          image: OMA_SERVER_IMAGE  # replaced at deploy time
          command: ["sh", "-c", "mkdir -p /root/.pi/agent && cp -a /opt/pi-agent-seed/. /root/.pi/agent/ && cp /seed/auth.json /root/.pi/agent/auth.json && chmod 600 /root/.pi/agent/auth.json"]
          volumeMounts:
            - { name: pi-auth-seed, mountPath: /seed, readOnly: true }
            - { name: pi-agent-dir, mountPath: /root/.pi/agent }
      containers:
        - name: server
          image: OMA_SERVER_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: oma-server-config }
          env:
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: PG_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: REDIS_PASSWORD } }
            - name: SUPABASE_SERVICE_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: SUPABASE_SERVICE_KEY } }
            # E2B sandbox endpoint + key (issue #54) — never baked into the image.
            - name: E2B_DOMAIN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: E2B_DOMAIN } }
            - name: E2B_API_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: E2B_API_KEY } }
            - name: AUTH_JWT_SECRET
              valueFrom: { secretKeyRef: { name: oma-secrets, key: AUTH_JWT_SECRET } }
            - name: INVITE_CODE
              valueFrom: { secretKeyRef: { name: oma-secrets, key: INVITE_CODE } }
            # The same VFS access token is exposed under two purpose-specific
            # names: vfs-cli receives VFS_TOKEN inside each sandbox through the
            # Host's DEFAULT_SANDBOX_VFS_TOKEN mapping; pi-mcp-adapter resolves
            # ${RDS_MCP_APIKEY} in the Host-only RDS MCP config.
            - name: DEFAULT_SANDBOX_VFS_TOKEN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
            - name: RDS_MCP_APIKEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
            - name: ALIYUN_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: oma-secrets, key: ALIYUN_ACCESS_KEY_ID } }
            - name: ALIYUN_ACCESS_KEY_SECRET
              valueFrom: { secretKeyRef: { name: oma-secrets, key: ALIYUN_ACCESS_KEY_SECRET } }
            # OpenGrove WW — DISABLED BY DEFAULT (issue #116). Uncomment only as
            # step 3 of the all-or-nothing procedure in the ConfigMap comment
            # above, and only after the oma-secrets key actually exists.
            # story-seed receives the WW credential only when a sandbox is
            # created. The value stays out of the image, ConfigMap, Agent row,
            # and repository; SessionRouter treats it as Host-managed so an
            # Agent cannot pair it with a different endpoint.
            # - name: DEFAULT_SANDBOX_OPENGROVE_WW_ACCESS_TOKEN
            #   valueFrom: { secretKeyRef: { name: oma-secrets, key: OPENGROVE_WW_ACCESS_TOKEN } }
          volumeMounts:
            - { name: pi-agent-dir, mountPath: /root/.pi/agent }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-server
  namespace: oma-infra
spec:
  selector: { app: oma-server }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-web
  namespace: oma-infra
  labels: { app: oma-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-web }
  template:
    metadata:
      labels:
        app: oma-web
        alibabacloud.com/acs: "true"
    spec:
      imagePullSecrets:
        - name: ali-shanghai
      containers:
        - name: web
          image: OMA_WEB_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-web
  namespace: oma-infra
spec:
  selector: { app: oma-web }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oma-console
  namespace: oma-infra
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80},{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - agentry.welltop.tech
      secretName: agentry-tls
  rules:
    - host: agentry.welltop.tech
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: oma-server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oma-web
                port:
                  number: 80
