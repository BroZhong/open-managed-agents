# Nautilus Server + Web on the brozhong ACS HK cluster.
# Deployed into ns oma-infra (same ns as Redis → avoids the cross-ns Service DNS
# NXDOMAIN trap on this ECI/virtual-kubelet cluster). Secrets injected via
# the oma-secrets Secret, never baked into the image.
#
# Create the secret first (values NOT committed):
# Omit ALIYUN_SUPABASE_INSTANCE when instance discovery is unambiguous.
#   kubectl -n oma-infra create secret generic oma-secrets \
#     --from-literal=PG_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=SUPABASE_SERVICE_KEY=... \
#     --from-literal=ALIYUN_ACCESS_KEY_ID=... \
#     --from-literal=ALIYUN_ACCESS_KEY_SECRET=... \
#     --from-literal=ALIYUN_SUPABASE_INSTANCE=... \
#     --from-literal=E2B_DOMAIN=... \
#     --from-literal=E2B_API_KEY=... \
#     --from-literal=DEFAULT_SANDBOX_VFS_TOKEN=...
#
# The sandbox is mandatory (issue #54): SANDBOX_ENABLED=true below + the E2B_*
# secrets are what make Agent runs execute inside a sandbox. A sandboxed Agent
# with no provisionable executor now fails loud (session.error
# code=sandbox_unavailable) instead of falling back to the pod filesystem.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oma-server-config
  namespace: oma-infra
data:
  PORT: "3000"
  AUTH_DISABLED: "false"
  # PostgreSQL (internal RDS; oma schema; sslmode=disable)
  PG_HOST: "pgm-j6cwo1dku533bqbs.pg.cnhk.rds.aliyuncs.com"
  PG_PORT: "5432"
  PG_DATABASE: "supabase_db"
  PG_USER: "oma_app"
  PG_SCHEMA: "oma"
  PG_SSL: "false"
  # The oma schema is pre-provisioned by migration and oma_app lacks CREATE on
  # the database, so skip the app's startup DDL.
  PG_ENSURE_SCHEMA: "false"
  # Redis — use ClusterIP, NOT the Service name: even same-ns Service DNS is
  # unreliable on this ECI/virtual-kubelet cluster (name "redis" → NXDOMAIN).
  # Re-check with `kubectl -n oma-infra get svc redis` if it drifts.
  REDIS_HOST: "10.0.56.147"
  REDIS_PORT: "6379"
  # Supabase Storage (S3 artifacts) — VPC endpoint, bucket workspace
  S3_ENDPOINT: "http://172.17.108.247:80/storage/v1"
  S3_BUCKET: "workspace"
  # Host-managed, tenant-scoped Supabase Sessions MCP. Credentials remain in
  # oma-secrets; its single tool executes a fixed bounded SELECT. This exact,
  # comma-separated tenant allowlist is mandatory and fails closed when empty.
  OMA_SUPABASE_ALLOWED_TENANTS: "c912f882-3c5c-4355-8b7e-ca6aaccf58bc,05185627-3eb6-4958-ba6f-4dd86b975485"
  ALIYUN_REGION: "cn-hongkong"
  # Egress proxy for LLM calls (OpenAI/Anthropic geo-block Alibaba HK egress).
  # In-cluster sing-box (mixed inbound). ClusterIP — re-check if it drifts.
  OMA_PROXY_URL: "http://10.0.200.134:7890"
  # Sandbox is mandatory (issue #54). This turns on the sandbox-backed
  # ToolExecutor; the E2B endpoint + key come from oma-secrets (below).
  SANDBOX_ENABLED: "true"
  # E2B templateID = the SandboxSet name in the sandbox-system namespace
  # (see deploy/sandbox/README.md). The code-interpreter warm pool.
  SANDBOX_TEMPLATE: "code-interpreter-vfscli"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-server
  namespace: oma-infra
  labels: { app: oma-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-server }
  template:
    metadata:
      labels: { app: oma-server }
    spec:
      imagePullSecrets:
        - name: oma-acr
      volumes:
        # Pi provider credentials (openai-codex OAuth). Copied to a writable
        # emptyDir by initContainer so Pi's AuthStorage can refresh the token.
        - name: pi-auth-seed
          secret: { secretName: oma-pi-auth }
        - name: pi-agent-dir
          emptyDir: {}
      initContainers:
        - name: seed-pi-auth
          image: OMA_SERVER_IMAGE  # replaced at deploy time
          command: ["sh", "-c", "mkdir -p /root/.pi/agent && cp -a /opt/pi-agent-seed/. /root/.pi/agent/ && cp /seed/auth.json /root/.pi/agent/auth.json && chmod 600 /root/.pi/agent/auth.json"]
          volumeMounts:
            - { name: pi-auth-seed, mountPath: /seed, readOnly: true }
            - { name: pi-agent-dir, mountPath: /root/.pi/agent }
      containers:
        - name: server
          image: OMA_SERVER_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: oma-server-config }
          env:
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: PG_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: REDIS_PASSWORD } }
            - name: SUPABASE_SERVICE_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: SUPABASE_SERVICE_KEY } }
            # Deployment-scoped credentials for the managed Aliyun RDS
            # Supabase Sessions MCP. Tenant and query shape are injected and
            # fixed by the Host; the Agent cannot supply SQL or an endpoint.
            # Other launch environments may use the documented
            # ALIBABA_CLOUD_* aliases; this deployment keeps ALIYUN_*.
            - name: ALIYUN_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: oma-secrets, key: ALIYUN_ACCESS_KEY_ID } }
            - name: ALIYUN_ACCESS_KEY_SECRET
              valueFrom: { secretKeyRef: { name: oma-secrets, key: ALIYUN_ACCESS_KEY_SECRET } }
            # Optional: set only when more than one running Supabase instance
            # is discoverable. Omitting the Secret key keeps discovery enabled.
            - name: ALIYUN_SUPABASE_INSTANCE
              valueFrom: { secretKeyRef: { name: oma-secrets, key: ALIYUN_SUPABASE_INSTANCE, optional: true } }
            # E2B sandbox endpoint + key (issue #54) — never baked into the image.
            - name: E2B_DOMAIN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: E2B_DOMAIN } }
            - name: E2B_API_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: E2B_API_KEY } }
            # The same VFS access token is exposed under two purpose-specific
            # names: vfs-cli receives VFS_TOKEN inside each sandbox through the
            # Host's DEFAULT_SANDBOX_VFS_TOKEN mapping; pi-mcp-adapter resolves
            # ${RDS_MCP_APIKEY} in the Host-only RDS MCP config.
            - name: DEFAULT_SANDBOX_VFS_TOKEN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
            - name: RDS_MCP_APIKEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
          volumeMounts:
            - { name: pi-agent-dir, mountPath: /root/.pi/agent }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-server
  namespace: oma-infra
spec:
  selector: { app: oma-server }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-web
  namespace: oma-infra
  labels: { app: oma-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-web }
  template:
    metadata:
      labels: { app: oma-web }
    spec:
      imagePullSecrets:
        - name: oma-acr
      containers:
        - name: web
          image: OMA_WEB_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-web
  namespace: oma-infra
spec:
  selector: { app: oma-web }
  ports:
    - port: 80
      targetPort: 80
