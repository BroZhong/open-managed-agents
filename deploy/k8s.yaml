# Managed WW remains off by default. To enable it, provision its Secret first
# (kubectl --kubeconfig "$OMA_APP_KUBECONFIG" -n oma-infra create secret generic ...),
# then configure all three variables together and restart the Host:
# DEFAULT_SANDBOX_OPENGROVE_WW_BASE_URL, DEFAULT_SANDBOX_OPENGROVE_WW_AGENT_IDS,
# DEFAULT_SANDBOX_OPENGROVE_WW_ACCESS_TOKEN (from oma-secrets OPENGROVE_WW_ACCESS_TOKEN).
# The auto-story per-Agent Secret is a separate existing configuration.
# Open Managed Agents Server + Web on the `agent-platform` ACS cluster in
# cn-shanghai. Application resources live in `oma-infra`; the ACK-managed
# sandbox control plane and warm pools live in `sandbox-system`.
#
# This file owns the OMA ConfigMap, Deployments, Services, and public Ingress.
# Redis, sing-box, the ALB controller, and the ACK sandbox-manager installation
# already exist in the cluster and are not created here. Secrets are injected
# at runtime and are never baked into an image.
#
# OMA_SERVER_IMAGE and OMA_WEB_IMAGE are release-time placeholders. Replace
# both with immutable images from
# registry-vpc.cn-shanghai.aliyuncs.com/welltop before applying this manifest.
#
# Create the secret first (values NOT committed):
# Supabase instance discovery is enabled in this deployment.
#   kubectl --kubeconfig ~/.kube/agent-platform-config -n oma-infra create secret generic oma-secrets \
#     --from-literal=PG_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=SUPABASE_SERVICE_KEY=... \
#     --from-literal=ALIYUN_ACCESS_KEY_ID=... \
#     --from-literal=ALIYUN_ACCESS_KEY_SECRET=... \
#     --from-literal=WORKSPACE_OSS_ACCESS_KEY_ID=... \
#     --from-literal=WORKSPACE_OSS_ACCESS_KEY_SECRET=... \
#     --from-literal=E2B_DOMAIN=... \
#     --from-literal=E2B_API_KEY=... \
#     --from-literal=DEFAULT_SANDBOX_VFS_TOKEN=... \
#     --from-literal=AUTH_JWT_SECRET=... \
#     --from-literal=INVITE_CODE=...
#
# The following objects must also exist before rollout:
#   - oma-infra/oma-pi-gateway (Pi auth.json and models.json)
#   - oma-infra/ali-shanghai (ACR image-pull credentials)
#   - oma-infra/agentry-tls  (TLS certificate for agentry.welltop.tech)
#
# The sandbox is mandatory (issue #54): SANDBOX_ENABLED=true below + the E2B_*
# secrets are what make Agent runs execute inside a sandbox. A sandboxed Agent
# with no provisionable executor now fails loud (session.error
# code=sandbox_unavailable) instead of falling back to the pod filesystem.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oma-server-config
  namespace: oma-infra
data:
  PORT: "3000"
  API_BASE_PATH: "/api"
  # OpenAPI paths are relative to this externally reachable API base.
  PUBLIC_API_URL: "https://agentry.welltop.tech/api"
  AUTH_DISABLED: "false"
  ALIYUN_REGION: "cn-shanghai"
  # Managed Supabase MCP remains fail-closed until production tenants are
  # explicitly reviewed for this cluster.
  OMA_SUPABASE_ALLOWED_TENANTS: ""
  # PostgreSQL (cn-shanghai internal RDS; oma schema; sslmode=disable)
  PG_HOST: "pgm-uf6fh394661t62gb.pg.rds.aliyuncs.com"
  PG_PORT: "5432"
  PG_DATABASE: "supabase_db"
  PG_USER: "oma_app"
  PG_SCHEMA: "oma"
  PG_SSL: "false"
  # The oma schema is pre-provisioned by migration and oma_app lacks CREATE on
  # the database, so skip the app's startup DDL.
  PG_ENSURE_SCHEMA: "false"
  # These ClusterIPs mirror the current agent-platform deployment. Re-check the
  # corresponding Services before applying if cluster infrastructure changes.
  REDIS_HOST: "10.0.64.18"
  REDIS_PORT: "6379"
  # Supabase Storage (S3 artifacts) — cn-shanghai VPC endpoint.
  S3_ENDPOINT: "http://172.17.255.52:80/storage/v1"
  S3_BUCKET: "workspace"
  STORAGE_PUBLIC_BASE: "http://172.17.255.52:80/storage/v1"
  WORKSPACE_OSS_REGION: "oss-cn-shanghai"
  WORKSPACE_OSS_BUCKET: "agentry"
  WORKSPACE_OSS_ENDPOINT: "https://oss-cn-shanghai.aliyuncs.com"
  WORKSPACE_OSS_PUBLIC_ENDPOINT: "https://oss-cn-shanghai.aliyuncs.com"
  # Shanghai CSI identity resources. Host object-storage credentials stay on
  # the Host; Sandbox credentials are issued separately by Agent Identity/RRSA.
  WORKSPACE_OSS_AGENT_NAME: "agentry-workspace"
  WORKSPACE_OSS_PV_NAME: "agentry-workspace-oss"
  WORKSPACE_OSS_CREDENTIAL_PROVIDER: "agentry-oss-rw"
  # In-cluster sing-box mixed inbound used for external LLM calls.
  OMA_PROXY_URL: "http://10.0.165.246:7890"
  # Sandbox is mandatory (issue #54). This turns on the sandbox-backed
  # ToolExecutor; the E2B endpoint + key come from oma-secrets (below).
  SANDBOX_ENABLED: "true"
  # E2B templateID = SandboxSet metadata.name in sandbox-system.
  SANDBOX_TEMPLATE: "auto-story-v2"
  E2B_REQUEST_TIMEOUT_MS: "185000"
  E2B_API_URL: "http://sandbox-manager.sandbox-system.svc.cluster.local:8080"
  E2B_SANDBOX_URL: "http://sandbox-manager.sandbox-system.svc.cluster.local:7788"
  NO_PROXY: "localhost,127.0.0.1,sandbox-manager.sandbox-system.svc.cluster.local"
  # All Agents inherit valid environment keys directly from this existing
  # Secret through E2B create.envs. Apply sandbox-base-secret-rbac.yaml first.
  SANDBOX_BASE_SECRET_NAMESPACE: "sandbox-system"
  SANDBOX_BASE_SECRET_NAME: "base-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-server
  namespace: oma-infra
  labels: { app: oma-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-server }
  template:
    metadata:
      labels:
        app: oma-server
        alibabacloud.com/acs: "true"
    spec:
      serviceAccountName: oma-server
      imagePullSecrets:
        - name: ali-shanghai
      volumes:
        - name: pi-gateway-config
          secret:
            secretName: oma-pi-gateway
            defaultMode: 0400
            items:
              - key: auth.json
                path: auth.json
              - key: models.json
                path: models.json
      containers:
        - name: server
          image: OMA_SERVER_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: oma-server-config }
            # Optional, all-or-nothing Host-owned auto-story environment.
            # Contains AUTO_STORY_AGENT_IDS + AUTO_STORY_SANDBOX_ENV_JSON.
            - secretRef: { name: oma-auto-story-env, optional: true }
          env:
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: PG_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: oma-secrets, key: REDIS_PASSWORD } }
            - name: SUPABASE_SERVICE_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: SUPABASE_SERVICE_KEY } }
            # Required Host OSS credentials, independent of the Sandbox's RRSA
            # identity and the Supabase service key used only for Skills.
            - name: WORKSPACE_OSS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: oma-secrets, key: WORKSPACE_OSS_ACCESS_KEY_ID } }
            - name: WORKSPACE_OSS_ACCESS_KEY_SECRET
              valueFrom: { secretKeyRef: { name: oma-secrets, key: WORKSPACE_OSS_ACCESS_KEY_SECRET } }
            # Deployment-scoped credentials for the managed Aliyun RDS
            # Supabase Sessions MCP. Tenant and query shape are injected and
            # fixed by the Host; the Agent cannot supply SQL or an endpoint.
            # Other launch environments may use the documented
            # ALIBABA_CLOUD_* aliases; this deployment keeps ALIYUN_*.
            - name: ALIYUN_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: oma-secrets, key: ALIYUN_ACCESS_KEY_ID } }
            - name: ALIYUN_ACCESS_KEY_SECRET
              valueFrom: { secretKeyRef: { name: oma-secrets, key: ALIYUN_ACCESS_KEY_SECRET } }
            # E2B sandbox endpoint + key (issue #54) — never baked into the image.
            - name: E2B_DOMAIN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: E2B_DOMAIN } }
            - name: E2B_API_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: E2B_API_KEY } }
            # Stable Host-only encryption key for Tenant provider credentials.
            - name: OMA_PROVIDER_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: OMA_PROVIDER_ENCRYPTION_KEY, optional: true } }
            - name: AUTH_JWT_SECRET
              valueFrom: { secretKeyRef: { name: oma-secrets, key: AUTH_JWT_SECRET } }
            - name: INVITE_CODE
              valueFrom: { secretKeyRef: { name: oma-secrets, key: INVITE_CODE } }
            # The same VFS access token is exposed under two purpose-specific
            # names: vfs-cli receives VFS_TOKEN inside each sandbox through the
            # Host's DEFAULT_SANDBOX_VFS_TOKEN mapping; pi-mcp-adapter resolves
            # ${RDS_MCP_APIKEY} in the Host-only RDS MCP config.
            - name: DEFAULT_SANDBOX_VFS_TOKEN
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
            - name: RDS_MCP_APIKEY
              valueFrom: { secretKeyRef: { name: oma-secrets, key: DEFAULT_SANDBOX_VFS_TOKEN } }
            - name: PI_CODING_AGENT_DIR
              value: /opt/pi-agent-seed
            # These explicit empty values match the production gateway setup.
            # HTTP proxying uses Node's environment support; the other proxy
            # paths must not inherit OMA_PROXY_URL from envFrom.
            - name: OMA_PROXY_URL
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: https_proxy
              value: ""
            - name: NODE_USE_ENV_PROXY
              value: "1"
            - name: HTTP_PROXY
              valueFrom:
                configMapKeyRef:
                  name: oma-server-config
                  key: OMA_PROXY_URL
            - name: http_proxy
              value: "$(HTTP_PROXY)"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,.svc,.cluster.local,172.17.255.52"
            - name: no_proxy
              value: "$(NO_PROXY)"
          volumeMounts:
            - name: pi-gateway-config
              mountPath: /opt/pi-agent-seed/auth.json
              subPath: auth.json
              readOnly: true
            - name: pi-gateway-config
              mountPath: /opt/pi-agent-seed/models.json
              subPath: models.json
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits: { cpu: "4", memory: "8Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-server
  namespace: oma-infra
spec:
  selector: { app: oma-server }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oma-web
  namespace: oma-infra
  labels: { app: oma-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: oma-web }
  template:
    metadata:
      labels:
        app: oma-web
        alibabacloud.com/acs: "true"
    spec:
      imagePullSecrets:
        - name: ali-shanghai
      containers:
        - name: web
          image: OMA_WEB_IMAGE  # replaced at deploy time
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: oma-web
  namespace: oma-infra
spec:
  selector: { app: oma-web }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oma-console
  namespace: oma-infra
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80},{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - agentry.welltop.tech
      secretName: agentry-tls
  rules:
    - host: agentry.welltop.tech
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: oma-server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oma-web
                port:
                  number: 80
